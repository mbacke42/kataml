<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="kataml-token" content="__KATAML_TOKEN__">
  <title>KataML</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="img/logo.svg" alt="" width="26" height="26">
      <span class="brand-name">kataml</span>
    </div>
    <div class="wf-name">
      <input id="wf-name" type="text" value="Sans titre" spellcheck="false" aria-label="Nom du workflow">
      <span id="wf-dirty" class="dirty" title="Modifications non enregistrées"></span>
    </div>
    <nav class="toolbar" aria-label="Actions du workflow">
      <button class="btn ghost" data-action="new" title="Nouveau workflow">
        <svg class="i"><use href="#i-file-plus"/></svg><span>Nouveau</span></button>
      <button class="btn ghost" data-action="open" title="Ouvrir un workflow ou un exemple">
        <svg class="i"><use href="#i-folder"/></svg><span>Ouvrir</span></button>
      <button class="btn ghost" data-action="project" title="Données et scripts : fichiers de données, bases SQLite et bibliothèque de scripts Python">
        <svg class="i"><use href="#c-io"/></svg><span>Données</span></button>
      <button class="btn ghost" data-action="save" title="Enregistrer (Ctrl+S)">
        <svg class="i"><use href="#i-save"/></svg><span>Enregistrer</span></button>
      <span class="sep"></span>
      <button class="btn ghost icon" data-action="undo" title="Annuler (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="btn ghost icon" data-action="redo" title="Rétablir (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg></button>
      <span class="sep"></span>
      <button class="btn ghost" data-action="annotate" title="Ajouter une annotation (A)">
        <svg class="i"><use href="#i-note"/></svg><span>Annotation</span></button>
      <button class="btn ghost" data-action="export-py" title="Exporter en script Python ou en notebook Jupyter">
        <svg class="i"><use href="#i-code"/></svg><span>Exporter</span></button>
      <button class="btn ghost" data-action="report" title="Générer un rapport HTML (imprimable en PDF)">
        <svg class="i"><use href="#c-report"/></svg><span>Rapport</span></button>
      <button class="btn ghost" data-action="layout" title="Organiser automatiquement (L) — la sélection, ou tout le workflow">
        <svg class="i"><use href="#i-layout"/></svg><span>Organiser</span></button>
      <span class="sep"></span>
      <button class="btn ghost" data-action="reset-all" title="Réinitialiser tous les nœuds">
        <svg class="i"><use href="#i-reset"/></svg><span>Réinitialiser</span></button>
      <button class="btn primary" data-action="run-all" title="Exécuter tout le workflow (Maj+F7)">
        <svg class="i"><use href="#i-play-all"/></svg><span>Tout exécuter</span></button>
      <button class="btn danger hidden" data-action="stop" title="Arrêter après le nœud en cours">
        <svg class="i"><use href="#i-stop"/></svg><span>Arrêter</span></button>
    </nav>
    <div class="topbar-right">
      <button class="btn ghost icon" data-action="help" title="Aide et raccourcis (F1)"><svg class="i"><use href="#i-help"/></svg></button>
      <button class="btn ghost icon lang-btn" data-action="lang" title="Langue : français / English">EN</button>
      <button class="btn ghost icon" data-action="appearance" title="Apparence : couleurs, mode, canevas"><svg class="i"><use href="#i-palette"/></svg></button>
      <button class="btn ghost icon" data-action="theme" title="Thème clair / sombre"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="btn ghost icon" data-action="quit" title="Quitter KataML (arrête le serveur)"><svg class="i"><use href="#i-power"/></svg></button>
    </div>
  </header>

  <main class="layout">
    <aside class="repo" id="repo" aria-label="Dépôt de nœuds">
      <div class="panel-head">
        <h2>Nœuds</h2>
        <span class="count" id="repo-count"></span>
        <button class="btn ghost sm" data-action="blocks" title="Créer et gérer vos propres blocs (extensions)" style="margin-left:auto">
          <svg class="i"><use href="#c-ext"/></svg>Mes blocs</button>
      </div>
      <div class="repo-mode seg" title="Classement des nœuds">
        <button data-repo-mode="guide" title="Chapitres du guide utilisateur de scikit-learn">Guide</button>
        <button data-repo-mode="api" title="Modules de l'API scikit-learn (sklearn.linear_model…)">API</button>
      </div>
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="repo-search" type="search" placeholder="Rechercher (ex. forêt, pca, roc)…" autocomplete="off">
      </div>
      <div class="repo-tree" id="repo-tree"></div>
      <div class="repo-foot" id="repo-foot"></div>
    </aside>
    <div class="splitter v" data-split="repo"></div>

    <section class="center">
      <div class="canvas-wrap" id="canvas-wrap" tabindex="0" aria-label="Éditeur de workflow">
        <div class="world" id="world">
          <svg class="edges" id="edges" aria-hidden="true"></svg>
          <div class="annotations" id="annotations"></div>
          <div class="nodes" id="nodes"></div>
        </div>
        <div class="selection-rect hidden" id="selection-rect"></div>
        <div class="canvas-empty" id="canvas-empty">
          <div class="empty-card">
            <img src="img/logo.svg" alt="" width="56" height="56">
            <h3>Construisez votre workflow</h3>
            <p>Glissez des nœuds depuis le dépôt de gauche, puis reliez une sortie à une entrée.
               Double-cliquez un nœud du dépôt pour l'ajouter et le relier au nœud sélectionné.</p>
            <div class="empty-actions">
              <button class="btn primary" data-action="open-examples">Ouvrir un exemple</button>
              <button class="btn" data-action="help">Prise en main</button>
            </div>
          </div>
        </div>
        <div class="zoombar">
          <button class="btn ghost icon" data-action="zoom-out" title="Zoom arrière"><svg class="i"><use href="#i-minus"/></svg></button>
          <button class="btn ghost zoom-label" data-action="zoom-reset" id="zoom-label" title="Zoom 100 %">100 %</button>
          <button class="btn ghost icon" data-action="zoom-in" title="Zoom avant"><svg class="i"><use href="#i-plus"/></svg></button>
          <button class="btn ghost icon" data-action="fit" title="Ajuster à l'écran (F)"><svg class="i"><use href="#i-fit"/></svg></button>
        </div>
      </div>
      <div class="splitter h" data-split="bottom"></div>
      <section class="bottom" id="bottom" aria-label="Sorties du nœud">
        <div class="bottom-head">
          <div class="tabs" id="out-tabs" role="tablist"></div>
          <div class="bottom-actions" id="out-actions"></div>
          <button class="btn ghost icon" data-action="toggle-bottom" title="Agrandir / réduire"><svg class="i"><use href="#i-expand"/></svg></button>
        </div>
        <div class="bottom-body" id="out-body"></div>
      </section>
    </section>

    <div class="splitter v" data-split="inspector"></div>
    <aside class="inspector" id="inspector" aria-label="Configuration du nœud"></aside>
  </main>

  <div class="ctxmenu hidden" id="ctxmenu" role="menu"></div>
  <div class="modal-backdrop hidden" id="modal-backdrop"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="file-input" class="hidden">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/></symbol>

  <script type="module" src="js/main.js"></script>
</body>
</html>
